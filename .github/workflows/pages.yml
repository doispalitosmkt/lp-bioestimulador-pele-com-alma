name: Deploy Bioestimulador LP to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "LP Bioestimuladores/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "LP Bioestimuladores/package-lock.json"

      - name: Install dependencies
        run: npm ci --prefix "LP Bioestimuladores"

      - name: Build LP
        run: npm run build --prefix "LP Bioestimuladores"

      - name: Start production server
        run: |
          npm run start --prefix "LP Bioestimuladores" -- --port 4189 > /tmp/pele-lp.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4189/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/pele-lp.log
          exit 1

      - name: Export static page
        run: node "LP Bioestimuladores/scripts/export-github-pages.mjs"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "LP Bioestimuladores/docs"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
